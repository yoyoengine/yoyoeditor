name: Compilation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DEPS_CACHE_VERSION: v1

jobs:
  build:
    name: Build with ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt-get install -y ${{ matrix.compiler }} ccache cmake ninja-build libdrm-dev libgbm-dev libfreetype6-dev libharfbuzz-dev nasm

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependency builds
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/_deps
          key: ${{ runner.os }}-${{ matrix.compiler }}-ninja-deps-${{ env.DEPS_CACHE_VERSION }}-${{ hashFiles('**/yoyoeditor/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-ninja-deps-${{ env.DEPS_CACHE_VERSION }}-

      - name: Cache compiler outputs
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.compiler }}-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
          ccache --zero-stats

      - name: Configure with CMake
        run: |
          mkdir -p ${{ github.workspace }}/build
          cd ${{ github.workspace }}/build
          CC=${{ matrix.compiler }} cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSDL_UNIX_CONSOLE_BUILD=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..

      - name: Build with ${{ matrix.compiler }}
        run: |
          cd ${{ github.workspace }}/build
          cmake --build . --parallel

      - name: Show ccache stats
        run: ccache --show-stats
